plugins {
    id 'java-library'
    alias(libs.plugins.dependencyManagement)
    id 'maven-publish'
}

group = 'RuyiBang'
version = '1.0.X'
description = 'OttPlatform Core Starter for logging, UUID, exception handling'

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation platform("RuyiBang:ottPlatform.root:1.0.X")
    implementation(libs.springBootWeb)
    implementation(libs.springBootSecurity)

    // JWT
    implementation "io.jsonwebtoken:jjwt-api"
    runtimeOnly "io.jsonwebtoken:jjwt-impl"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson"

    // Logging
    implementation "net.logstash.logback:logstash-logback-encoder"

    // Tests
    testImplementation(libs.springBootTest)
}

tasks.named('test') {
    useJUnitPlatform()
}
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        // For local development
        mavenLocal()

        // Optional remote publishing (for CI/CD)
        // maven {
        //     url = uri("https://your.company.repo/releases")
        //     credentials {
        //         username = findProperty("repoUser") ?: System.getenv("REPO_USER")
        //         password = findProperty("repoPass") ?: System.getenv("REPO_PASS")
        //     }
        // }
    }
}
